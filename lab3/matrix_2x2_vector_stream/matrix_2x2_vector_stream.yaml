name: "assert matrix_2x2_vector_stream(2, 1, 0, 0, 1, 5, 6, 2, 3, 4, 5, 1, -1) == [5, 6, -1, -1]"
limit: 2000
memory_size: 0x1000
memory_mapped_io:
  0x80: [2, 1, 0, 0, 1, 5, 6, 2, 3, 4, 5, 1, -1]
  0x84: []
reports:
  - name: Check results
    slice: last
    view: |
      a * x OR c * x : {T1:dec}
      b * y OR d * y : {T2:dec}
      overflow       : {T3:hex}